plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.\
    id "com.google.gms.google-services" 
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.minimals"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.0.13004108"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.minimals"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        
    }

    signingConfigs {
        
       debug {
            keyAlias keystoreProperties['debugKeyAlias']
            keyPassword keystoreProperties['debugStorePassword']
            storeFile keystoreProperties['debugStoreFile'] ? file(keystoreProperties['debugStoreFile']) : null
            storePassword keystoreProperties['debugKeyPassword']
        }
       dev {
            keyAlias keystoreProperties['devkeyAlias']
            keyPassword keystoreProperties['devkeyPassword']
            storeFile keystoreProperties['devstoreFile'] ? file(keystoreProperties['devstoreFile']) : null
            storePassword keystoreProperties['devstorePassword']
        }
        uat {
            keyAlias keystoreProperties['uatkeyAlias']
            keyPassword keystoreProperties['uatkeyPassword']
            storeFile keystoreProperties['uatstoreFile'] ? file(keystoreProperties['uatstoreFile']) : null
            storePassword keystoreProperties['uatstorePassword']
        }
        prod {
            keyAlias keystoreProperties['prodkeyAlias']
            keyPassword keystoreProperties['prodkeyPassword']
            storeFile keystoreProperties['prodstoreFile'] ? file(keystoreProperties['prodstoreFile']) : null
            storePassword keystoreProperties['prodstorePassword']
        }
    }

    buildTypes {
        release {

            def taskName = project.gradle.startParameter.taskNames.find { it.startsWith('assemble') }
            def flavor = taskName ? taskName.replaceAll('assemble(.*)Release', '$1').toLowerCase() : 'dev'
            println "Selected flavor: ${flavor}"

            signingConfig flavor == 'prod' ? signingConfigs.prod :
                    flavor == 'uat' ? signingConfigs.uat :
                            signingConfigs.dev
            debuggable false
            minifyEnabled true
            multiDexEnabled true
            proguardFiles(
                    getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
            )            
        }
        
        debug{
            def taskName = project.gradle.startParameter.taskNames.find { it.startsWith('assemble') }
            def flavor = taskName ? taskName.replaceAll('assemble(.*)Release', '$1').toLowerCase() : 'dev'
            println "Selected flavor: ${flavor}"

            signingConfig flavor == 'prod' ? signingConfigs.prod :
                    flavor == 'uat' ? signingConfigs.uat :
                            signingConfigs.dev
            minifyEnabled true
            multiDexEnabled true
        }
    }

    
    flavorDimensions "default"

     productFlavors{
        prod{
            dimension 
            resValue "string","app_name","Minimals"
            applicationIdSuffix ".app"
        }

        uat{
            resValue "string","app_name","Minimals-UAT"
            applicationIdSuffix ".uat"
        }

        dev{
            resValue "string","app_name","Minimals-DEV"
            applicationIdSuffix ".dev"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {

        // firebase
        implementation platform('com.google.firebase:firebase-bom:33.8.0')
        implementation 'com.google.firebase:firebase-analytics'

        // desugaring
        implementation 'androidx.window:window:1.0.0'
        implementation 'androidx.window:window-java:1.0.0'
        coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'

        implementation 'androidx.multidex:multidex:2.0.1'
        
        implementation 'androidx.core:core:1.9.0'
        implementation 'androidx.appcompat:appcompat:1.5.1'
        implementation 'com.google.android.material:material:1.7.0'

        implementation 'com.google.android.gms:play-services-mlkit-face-detection:17.1.0'
        implementation 'com.google.android.gms:play-services-location:21.0.1'
        implementation 'com.google.firebase:firebase-messaging:21.0.0'


}
