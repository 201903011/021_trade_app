name: minimals
description: "Master Boilerplate for Flutter projects with GetX, Firebase, and more."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  flutter_svg: ^2.0.17
  dio: ^5.8.0+1
  intl: ^0.19.0
  get_it: ^8.0.3
  injectable: ^2.5.0
  get_storage: ^2.1.1
  permission_handler: ^11.3.1
  lottie: ^3.3.1
  otp_autofill: ^4.1.0
  vibration: ^3.1.2
  dropdown_search: ^5.0.6
  image_picker: ^1.1.2
  dotted_border: ^2.1.0
  firebase_core: ^3.10.1
  sms_autofill: ^2.4.1
  firebase_analytics: ^11.4.1
  firebase_crashlytics: ^4.3.1
  firebase_remote_config: ^5.3.1
  firebase_messaging: ^15.2.1
  package_info_plus: ^8.2.0
  flexi_chip: ^1.0.8
  local_auth: ^2.3.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  file_picker: ^8.3.1
  path_provider: ^2.1.5
  open_file: ^3.5.10
  device_info_plus: ^11.2.2
  flutter_inappwebview: ^6.1.5
  flutter_localization: ^0.3.1
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.1.1
  flutter_udid: ^4.0.0
  syncfusion_flutter_pdfviewer: ^28.2.4
  flutter_localizations:
    sdk: flutter
  http: ^1.3.0
  auto_size_text: ^3.0.0
  number_paginator: ^0.4.3
  date_format_field: ^0.1.0
  mime: ^2.0.0
  google_maps_flutter: ^2.12.1
  geocoding: ^3.0.0
  http_parser: ^4.1.2
  shared_preferences: ^2.3.3
  # Additional packages for components
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  fl_chart: ^0.69.0
  photo_view: ^0.15.0
  flutter_animate: ^4.5.0
  flutter_markdown: ^0.7.4+1
  flutter_colorpicker: ^1.1.0
  file_icon: ^1.0.0
  flutter_quill: ^11.4.1
  table_calendar: ^3.1.2
  expandable: ^5.0.1
  flutter_breadcrumb: ^1.0.1
  animations: ^2.0.11
  smooth_page_indicator: ^1.2.0
  flutter_staggered_grid_view: ^0.7.0
  device_preview: ^1.2.0
  sqflite: ^2.3.3+1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: any
  injectable_generator: any
  flutter_native_splash: ^2.2.18
  flutter_launcher_icons: "^0.14.3"

flutter_icons:
  image_path: "assets/png/logos/logo_single.png"
  android: "launcher_icon"
  ios: true

flutter:
  uses-material-design: true
  assets:
    # taking all assets from the assets directory
    - assets/
    - assets/png/
    - assets/png/logos/
    - assets/background/
    - assets/icons/
    - assets/illustrations/
    - assets/illustrations/characters/
    - assets/images/
    - assets/sounds/
    - assets/langs/

  fonts:
    - family: CircularStd
      fonts:
        - asset: fonts/circular_std/CircularStd-Bold.otf
          weight: 700
        - asset: fonts/circular_std/CircularStd-Book.otf
          weight: 400
        - asset: fonts/circular_std/CircularStd-Medium.otf
          weight: 500

    - family: Roboto
      fonts:
        - asset: fonts/roboto/Roboto-Bold.ttf
          weight: 700
        - asset: fonts/roboto/Roboto-Regular.ttf
          weight: 400
